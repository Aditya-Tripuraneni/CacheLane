name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test, Lint & Type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Type-check audit package
        run: npm run typecheck:audit

      # plugin/bin/cachelane-audit.mjs is a committed build output that the
      # Claude Code plugin runs directly; fail if it is stale vs. the source.
      - name: Plugin bundle is up to date
        run: npm run build:audit && git diff --exit-code plugin/bin/cachelane-audit.mjs

      - name: Recorded benchmark smoke
        run: npm run benchmark:recorded

  audit-node:
    name: Audit CLI (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The committed bundle needs no install; run it on the fixtures and a hook payload.
      - name: Audit and hook smoke
        run: |
          mkdir -p "$RUNNER_TEMP/claude/projects"
          cp -r packages/audit/src/__tests__/fixtures "$RUNNER_TEMP/claude/projects/"
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude" node plugin/bin/cachelane-audit.mjs --json \
            | node -e 'const r = JSON.parse(require("fs").readFileSync(0, "utf8")); if (r.sessions !== 5) { console.error(r); process.exit(1); }'
          echo '{"session_id":"x","transcript_path":"/nope"}' | node plugin/bin/cachelane-audit.mjs hook prompt

  doctor:
    name: Doctor smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Doctor smoke
        run: npm run doctor:ci
