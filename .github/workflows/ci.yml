name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test, Lint & Type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Type-check audit package
        run: npm run typecheck:audit

      # plugin/bin/cachelane-audit.mjs is a committed build output that the
      # Claude Code plugin runs directly; fail if it is stale vs. the source.
      - name: Plugin bundle is up to date
        run: npm run build:audit && git diff --exit-code plugin/bin/cachelane-audit.mjs

      - name: Recorded benchmark smoke
        run: npm run benchmark:recorded

  doctor:
    name: Doctor smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Doctor smoke
        run: npm run doctor:ci
